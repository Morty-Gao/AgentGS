[agent]
planning_mode = "skill_guided"
allow_rule_planning = false
plan_attempts = 3
tool_attempts = 3
rs_local_contracts = true
rs_explicit_references = false
geosparql_llm = false
model_attempts = 4
argument_attempts = 3
retry_base_seconds = 1.0
retry_jitter_seconds = 0.35
embedding_model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
embedding_threads = 4
embedding_batch_size = 8
index_path = "data/geotoolkg"
model_cache = "model/models--qdrant--paraphrase-multilingual-MiniLM-L12-v2-onnx-Q"

[agent.modules]
planning_structure = "hierarchical"
predecessor_expansion = true
capability_completion = true
directed_bridging = true
tool_selection = "optimized"
execution_recovery = true
