# Configuration syntax follows the agreed provider/model separation.
# Replace capabilities and budgets with verified metadata for your provider.
schema_version = 1
[providers.geogpt]
base_url = "${GEOGPT_BASE_URL}"
api_key = "${GEOGPT_API_KEY}"
[models.default]
provider = "geogpt"
model = "${GEOGPT_MODEL}"
context_window = 80000
max_output_tokens = 8192
supported_efforts = []
[models.default.capabilities]
tool_calling = true
