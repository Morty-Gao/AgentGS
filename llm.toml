# Local sglang services on 10.102.211.12. Pass --model to select a key.
# Qwen3.8-27B accepts xhigh, medium, and low. The Qwen3.5 services accept max.
schema_version = 1

[providers.qwen38-27b]
base_url = "http://10.102.211.12:30000/v1"
api_key = "none"
timeout_seconds = 600
max_concurrent_requests = 128

[models.qwen38-27b]
provider = "qwen38-27b"
model = "Qwen3.8-27B"
context_window = 262144
max_output_tokens = 32768
supported_efforts = ["xhigh", "medium", "low"]
default_effort = "xhigh"

[models.qwen38-27b.capabilities]
tool_calling = true

