[project]
name = "agentgs"
version = "0.2.0"
description = "Typed geoscience agent with task-oriented runtime"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{name = "Morty-Gao", email = "2021420270@qq.com"}]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.15,<2", "pydantic>=2.10,<3",
  "httpx[socks]>=0.28,<1", "typer>=0.16,<1", "rich>=14,<15",
  "psutil>=7,<8", "python-dotenv>=1,<2",
]
[project.optional-dependencies]
visualization = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
scientific = ["pandas>=2.2,<3", "openpyxl>=3.1,<4", "rasterio>=1.4,<2", "shapely>=2,<3", "pyproj>=3.6,<4", "pillow>=10,<13"]
retrieval = ["fastembed==0.8.0"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.12,<1"]
[project.scripts]
agentgs = "agentgs.cli.app:main"
[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.build-backend]
source-include = ["scripts/**", "src/tests/**", "docs/algorithm_alignment.json", "uv.lock", "llm.toml", "config.toml", ".env.example"]
source-exclude = ["**/node_modules/**", "**/__pycache__/**", "**/.pytest_cache/**"]
wheel-exclude = ["**/node_modules/**", "**/frontend/src/**", "**/frontend/package*.json", "**/frontend/tsconfig.json", "**/frontend/vite.config.ts"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
